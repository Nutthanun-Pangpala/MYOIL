services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myoil
      POSTGRES_PASSWORD: myoil
      POSTGRES_DB: myoil
    ports:
      # 5434 so it can run next to BookCare's database (5433)
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
